# version: "3.8"

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

services:
  node-exporter:
    container_name: node_exporter
    image: prom/node-exporter:latest
    restart: unless-stopped
    networks: [monitoring]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    expose:
      - "9100"

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    networks: [monitoring]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/server_alerts.yml:/etc/prometheus/server_alerts.yml:ro
      - ./prometheus/cosmos_alerts_cometbft.yml:/etc/prometheus/cosmos_alerts_cometbft.yml:ro
      - ./prometheus/cosmos_alerts_tendermint.yml:/etc/prometheus/cosmos_alerts_tendermint.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    container_name: alertmanager
    image: prom/alertmanager:latest
    restart: unless-stopped
    networks: [monitoring]
    volumes:
      - ./alertmanager/:/etc/alertmanager/:ro
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
    expose:
      - "9093"

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    networks: [monitoring]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

